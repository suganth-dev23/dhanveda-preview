<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- PWA & Mobile Web App Meta Tags -->
    <meta name="theme-color" content="#F7F6F3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0E14" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DhanVeda" />
    <meta name="description" content="Personal finance, expense tracker, budgets, investments and split expenses for INR users" />

    <title>DhanVeda — INR Personal Finance & Wealth Tracker</title>
    
    <!-- Preload Self-hosted Latin Font (Phase 1.4) -->
    <link rel="preload" href="/fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    
    <!-- Prevent theme flash and initialize perf mode on page load -->
    <script>
      (function() {
        try {
          const saved = localStorage.getItem('dhanveda_dark_mode');
          const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'true' || (saved === null && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}

        try {
          const perf = localStorage.getItem('dhanveda_perf');
          const isLowEnd = (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4) ||
                           (navigator.deviceMemory && navigator.deviceMemory <= 4);
          if (perf === 'lite' || (perf !== 'full' && isLowEnd)) {
            document.documentElement.setAttribute('data-perf', 'lite');
          }
        } catch (e) {}

        try {
          if (localStorage.getItem('dhanveda_privacy') === 'on') {
            document.documentElement.setAttribute('data-privacy', 'on');
          }
        } catch (_) {}

        try {
          // Self-heal: If motion was stuck in 'off' from prior calm mode toggle, clear it!
          if (localStorage.getItem('dhanveda_motion') === 'off') {
            localStorage.removeItem('dhanveda_motion');
          }
          // Set data-motion on documentElement: 'off' if explicitly reduced, otherwise 'on' for full fluid animations
          if (localStorage.getItem('dhanveda_motion') === 'off') {
            document.documentElement.dataset.motion = 'off';
          } else {
            document.documentElement.dataset.motion = 'on';
          }

          if (localStorage.getItem('dhanveda_calm_mode') === 'true') {
            document.documentElement.setAttribute('data-calm', 'true');
          } else {
            document.documentElement.removeAttribute('data-calm');
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="h-full bg-app text-ink-1 font-['Plus_Jakarta_Sans',sans-serif]">
    <div id="root" class="min-h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
